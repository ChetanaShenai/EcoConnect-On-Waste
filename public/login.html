<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoConnect Login</title>
</head>
<body>

  <h1>EcoConnect Login</h1>

  <form id="loginForm">
    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="Enter username" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password" required><br><br>

    <label for="role">Login as:</label>
    <select id="role" required>
      <option value="">-- Select Role --</option>
      <option value="user">User</option>
      <option value="volunteer">Volunteer</option>
      <option value="ngo">NGO</option>
    </select><br><br>

    <button type="submit">Login</button>
  </form>

  <script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(e){
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      if (!username || !password || !role) {
        alert("Please fill all fields");
        return;
      }

      // Simple demo redirect
      if (role === "user" || role === "volunteer") {
        window.location.href = "schedule.html";
      } else if (role === "ngo") {
        window.location.href = "ngo.html";
      } else {
        alert("Invalid role");
      }
    });
  </script>

</body>
</html>
